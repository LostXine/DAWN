<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LangToMo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png" sizes="32x32">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f4f9;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .video-grid {
      width: 100%;
      max-width: 98%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 1rem;
      padding: 1rem;
    }

    .video-grid video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .video-caption {
      text-align: center;
      margin-top: 1rem;
      color: #666;
      font-size: 0.9rem;
    }

    .content-section {
      padding-top: 2rem;
    }

    .container {
      text-align: center;
      padding: 2rem 3rem;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 95%;
      margin: 0 auto;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      color: #4A90E2;
    }

    p {
      font-size: 1.25rem;
      color: #666;
    }

    .authors {
      margin: 1rem 0;
      font-size: 1.1rem;
      color: #444;
      line-height: 1.6;
    }
    
    .authors a {
      color: #4A90E2;
      text-decoration: none;
    }
    
    .authors a:hover {
      text-decoration: underline;
    }

    .institution {
      font-style: italic;
      margin-top: 0.5rem;
      color: #555;
    }
    
    .abstract, .teaser-figure {
      text-align: center;
      max-width: 800px;
      margin: 2rem auto;
    }
    
    .abstract {
      text-align: justify;
      text-justify: inter-word;
      line-height: 1.8;
    }
    
    .abstract h2 {
      color: #4A90E2;
      margin-bottom: 1rem;
      text-align: center;
    }
    
    .abstract p {
      font-size: 1.1rem;
      color: #444;
    }
    
    .abstract em {
      font-style: italic;
      font-weight: 500;
    }
    
    .langtomo-highlight {
      background: linear-gradient(90deg, #4A90E2, #2ecc71);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent; /* Fallback for non-WebKit browsers */
      font-weight: 600;
      padding: 0 4px;
      position: relative;
      display: inline-block;
    }
    
    .langtomo-highlight::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, #4A90E2, #2ecc71);
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.3s ease;
    }
    
    .langtomo-highlight:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }
    
    /* Make results section scrollable on mobile */
    @media (max-width: 768px) {
      .results-section {
        width: 100%;
        max-width: 95%;
        margin: 2rem auto;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding: 0 10px;
      }

      .results-section table {
        width: auto;
        min-width: 100%;
        margin: 0;
      }
      
      .results-section::-webkit-scrollbar {
        height: 6px;
      }
      
      .results-section::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 3px;
      }
      
      .results-section::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 3px;
      }
      
      .results-section::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
    }
    
    .demo-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    
    .demo-item {
      flex: 1 0 auto;
      min-width: 250px;
      max-width: 500px; /* Limit maximum width of items */
      text-align: center;
      display: flex;
      flex-direction: column;
      height: 300px;
      margin: 0 auto;
    }
    
    .demo-arrow {
      font-size: 1.5rem;
      color: #4A90E2;
      width: 100%;
      text-align: center;
      display: none;
    }
    
    .demo-horizontal-arrow {
      font-size: 1.5rem;
      color: #4A90E2;
      align-self: center;
      position: relative;
      z-index: 10; /* Ensure arrow appears above demo-item */
      margin: 0 1.5rem; /* Increased horizontal spacing */
      flex-shrink: 0; /* Prevent arrow from shrinking */
    }
    
    @media (max-width: 768px) {
      .demo-container {
        flex-direction: column;
        align-items: center;
        width: 100%;
        padding: 0 1rem;
        box-sizing: border-box;
      }
      .demo-row {
        flex-direction: column;
        align-items: center;
      }
      .demo-item {
        width: 100%;
        max-width: 100%;
        margin: 0 auto 1rem;
        padding: 0 1rem;
        box-sizing: border-box;
        position: relative;
        z-index: 1; /* Ensure demo-item stays below the arrow */
      }
      .demo-arrow {
        display: block !important;
        margin: 10px 0;
      }
      .demo-horizontal-arrow {
        display: none !important;
      }
    }
  </style>
</head>
<body>
