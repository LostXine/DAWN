defaults:
  - _self_
  - model: LTM_VPP
  - task: calvin
  - annotation: validation
  
project: DAWN_infer

accelerator:
  mixed_precision: fp16
  log_with: wandb

seed: 0

weights: ./outputs/DAWN_stage_2/2025-06-27_13-05-21/checkpoints/model_0002000.pth
