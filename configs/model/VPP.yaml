_target_: dawn.models.arch.VPP.ImagineToAct
# _target_: dawn.models.system1.raft.RAFT

imagine_model: 
      _target_: dawn.models.system2.svd.SDVideoMotion
      pretrained: stable-diffusion-v1-5/stable-diffusion-v1-5
      flow_to_rgb: False
      use_cfg: False
      use_interval: False
      num_inference_steps: 25
      input_type: rgb_static
      support_types: [ ]
      use_text_sentence: False
      num_frames: 4
      condition_dim: 1024

action_model: 
      _target_: dawn.models.system1.tdp.TransformerDiffusionPolicy
      # image_size: 256
      in_channels: 5
      obs_dim: 384
      goal_dim: 1024
      num_latents: 257
      num_sampling_steps: 10

